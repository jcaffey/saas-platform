name: AWS Identity Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::388260576957:role/saas-platform-dev-github-deploy
          aws-region: us-east-1

      - name: Show AWS identity
        run: aws sts get-caller-identity
